# Повний стенд у Docker: бекенд з SQLite файлом у томі, фронтенд nginx.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: likemind-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/social_search.db
      OAUTHLIB_INSECURE_TRANSPORT: "1"
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    networks:
      - likemind-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    container_name: likemind-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=8000
    networks:
      - likemind-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  likemind-network:
    driver: bridge
